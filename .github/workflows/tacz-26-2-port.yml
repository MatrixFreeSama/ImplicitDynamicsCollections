name: TACZ 26.2 Port CI

on:
  push:
    branches:
      - ci/tacz-neoforge-26.2-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone NeoForge 1.21.1 TACZ port
        run: |
          git clone --depth 1 https://github.com/RaeYNCreations/TACZ-1.21.1-neoforge-1.21.1.git work
          cd work
          git rev-parse HEAD | tee ../base-commit.txt

      - name: Apply 26.2 migration pass
        run: python3 tools/tacz26_port.py work

      - name: Compile
        id: compile
        shell: bash
        run: |
          set +e
          cd work
          chmod +x gradlew
          ./gradlew compileJava --stacktrace --no-daemon 2>&1 | tee ../compile.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../compile-status.txt
          exit 0

      - name: Save source diff
        if: always()
        run: |
          cd work
          git diff -- . ':!gradle/wrapper/gradle-wrapper.jar' > ../port.diff || true
          cd ..
          zip -qr TACZ-26.2-port-source.zip work \
            -x 'work/.git/*' 'work/.gradle/*' 'work/build/*' 'work/run/*'

      - name: Copy JARs if produced
        if: always()
        run: |
          mkdir -p out
          find work/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} out/ \; 2>/dev/null || true

      - name: Upload diagnostics and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TACZ-26.2-port-pass
          if-no-files-found: warn
          path: |
            compile.log
            compile-status.txt
            base-commit.txt
            port.diff
            TACZ-26.2-port-source.zip
            out/*.jar

      - name: Fail if compilation failed
        if: always()
        run: |
          status=$(cat compile-status.txt 2>/dev/null || echo 1)
          if [ "$status" != "0" ]; then
            echo "Compilation failed with status $status"
            exit "$status"
          fi
